<title>הבית שלנו</title>
<style>
:root{--bg:#f6f2ea;--card:#fffdf9;--ink:#1d2420;--mut:#5d665f;--line:#e3dccd;--acc:#1f6b52;--acct:#fff;--err:#a3321f;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1e2125;--ink:#eceae4;--mut:#a3a9a4;--line:#30353a;--acc:#6fd0aa;--acct:#0e231b;--err:#ff9d8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Rubik",-apple-system,BlinkMacSystemFont,"Segoe UI","Heebo","Arial Hebrew",Arial,sans-serif}
#gate{max-width:400px;margin:0 auto;padding:12vh 20px 24px}
#gate h1{margin:0 0 4px;font-size:1.7rem}
#gate p{margin:0 0 20px;color:var(--mut)}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px}
#gate label{display:block;font-weight:600;margin-bottom:6px}
#gate input[type=password],#gate input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;inline-size:100%;direction:ltr;text-align:start}
#gate .chk{display:flex;align-items:center;gap:8px;font-weight:400;margin:12px 0 0;min-block-size:44px}
#gate .chk input{inline-size:20px;block-size:20px;accent-color:var(--acc)}
#gate button[type=submit]{font:inherit;font-weight:700;inline-size:100%;margin-top:12px;border:0;border-radius:12px;padding:14px;background:var(--acc);color:var(--acct);cursor:pointer;min-block-size:50px}
#gate button[type=submit]:disabled{opacity:.6}
#msg{color:var(--err);min-block-size:1.5em;margin:10px 0 0;font-size:.95rem}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.vh{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%)}
</style>
</head>
<body>
<div id="gate" hidden>
  <h1>הבית שלנו</h1>
  <p>העמוד הזה פרטי. כדי לפתוח אותו צריך סיסמה.</p>
  <form id="login">
    <input class="vh" type="text" name="username" autocomplete="username" value="home" tabindex="-1" aria-hidden="true" readonly>
    <label for="current-password">סיסמה</label>
    <input id="current-password" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" required>
    <label class="chk"><input type="checkbox" id="show"> להציג את הסיסמה</label>
    <label class="chk"><input type="checkbox" id="keep" checked> לזכור אותי במכשיר הזה</label>
    <button type="submit">כניסה</button>
    <p id="msg" role="alert"></p>
  </form>
</div>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), hex=u=>[...u].map(b=>b.toString(16).padStart(2,'0')).join('');
const gate=document.getElementById('gate'), msg=document.getElementById('msg'), pw=document.getElementById('current-password');
async function derive(pass){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:ub(P.salt),iterations:P.it},km,512));
}
async function openWith(bits){
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-GCM',false,['encrypt','decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.iv)},key,ub(P.ct));
  const app=JSON.parse(new TextDecoder().decode(pt));
  gate.hidden=true; document.getElementById('root').innerHTML=app.html;
  new Function('IH',app.js)({data:app.data,key,auth:hex(bits.slice(32)),lock(){ try{localStorage.removeItem('ih-k');localStorage.removeItem('ih-s');}catch(e){} location.reload(); }});
}
document.getElementById('show').addEventListener('change',e=>{ pw.type=e.target.checked?'text':'password'; });
document.getElementById('login').addEventListener('submit',async e=>{
  e.preventDefault(); const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true; msg.textContent='';
  try{ const bits=await derive(pw.value.trim().toLowerCase()); await openWith(bits);
    if(document.getElementById('keep').checked){ try{localStorage.setItem('ih-k',btoa(String.fromCharCode(...bits)));}catch(_){} } }
  catch(err){ msg.textContent='הסיסמה לא נכונה. נסי שוב.'; btn.disabled=false; pw.select(); }
});
(async()=>{ let k=null; try{k=localStorage.getItem('ih-k');}catch(e){}
  if(k){ try{ await openWith(ub(k)); return; }catch(e){ try{localStorage.removeItem('ih-k');}catch(_){} } }
  gate.hidden=false; pw.focus(); })();
</script>
